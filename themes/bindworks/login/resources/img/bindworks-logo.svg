<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 164 44" width="164" height="44" role="img" aria-label="Bindworks">
  <title>Bindworks</title>
  <style>
    /* Letters rise into place, the blue W rides in from the left. Self-contained, so it
       works wherever the logo is used, an img element included. Delete this style
       block for a completely static logo. */
    .letter {
      opacity: 0;
      transform: translateY(6px) scale(0.985);
      transform-origin: 50% 75%;
      animation: bw-logo-rise 0.7s var(--delay, 0s) cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
    }
    .letter:nth-of-type(1) { --delay: 300ms; }
    .letter:nth-of-type(2) { --delay: 380ms; }
    .letter:nth-of-type(3) { --delay: 460ms; }
    .letter:nth-of-type(4) { --delay: 540ms; }
    .letter:nth-of-type(5) { --delay: 620ms; }
    .letter:nth-of-type(6) { --delay: 700ms; }
    .letter:nth-of-type(7) { --delay: 840ms; }
    .letter:nth-of-type(8) { --delay: 920ms; }
    .letter:nth-of-type(9) { --delay: 1000ms; }
    .letter:nth-of-type(10) { --delay: 1080ms; }

    .letter-w {
      opacity: 1;
      transform: translateX(-70px);
      transform-box: fill-box;
      transform-origin: center;
      animation: bw-logo-ride-in 1.2s 0.15s cubic-bezier(0.22, 0.9, 0.22, 1) forwards;
    }

    @keyframes bw-logo-rise {
      from { opacity: 0; transform: translateY(6px) scale(0.985); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes bw-logo-ride-in {
      from { transform: translateX(-70px); }
      to   { transform: translateX(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      .letter,
      .letter-w {
        animation: none;
        opacity: 1;
        transform: none;
      }
    }
  </style>
