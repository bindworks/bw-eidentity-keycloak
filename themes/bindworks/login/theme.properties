parent=keycloak.v2
import=common/keycloak

styles=css/styles.css css/fonts.css css/bindworks.css
scripts=js/header.js

# the Bindworks look is light only
darkMode=false

# Logos of the identity providers Keycloak has none of its own for. The base template takes these
# classes verbatim; css/bindworks.css draws img/idp/<name>.svg for each of them. They also keep the
# provider's own icon classes out (the Apple provider returns "fa fa-apple", and PatternFly 5 ships
# no Font Awesome *brands* font, so that glyph would render as a missing-glyph box).
# A blank value instead of a class list means "use Keycloak's built-in logo", as keycloak.v2 does
# for google & co.
kcLogoIdP-apple=bw-idp bw-idp-apple
